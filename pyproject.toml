[project]
name = "ashare-quant-tutorial-examples"
version = "0.1.0"
description = "A 股量化教程的离线可运行示例与回归测试"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "polars>=1.39,<2",
  "pyarrow>=17,<24",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
data = ["akshare>=1.19,<2"]
ml = ["lightgbm>=4.6,<5", "shap>=0.49,<1"]
deep = ["torch>=2.10,<3"]
optimization = ["cvxpy>=1.8,<2"]

[tool.uv]
package = false
